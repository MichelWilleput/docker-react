sudo: required
services:
  - docker
before_install:
  - docker build -f Dockerfile.dev -t michelwilleput/docker-react .
script:
  - docker run -e CI=true michelwilleput/docker-react npm run test
deploy:
  provider: elasticbeanstalk
  region: "us-east-1"
  app: "frontend"
  env: "Frontend-env"
  bucket_name: "elasticbeanstalk-us-east-1-235809062041"
  bucket_path: "frontend"
  on:
    branch: main
  access_key_id: "$aws_access_key"
  secret_access_key: "$aws_secret_key"