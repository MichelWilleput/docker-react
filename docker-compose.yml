version: '3'
services:  
  react-app:
    restart: on-failure
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - /app/node_modules     #use /app/node_modules from container - no local equivalent
      - .:/app                #map local current dir to container /app dir
  tests:
    restart: on-failure
    build:
      context: .
      dockerfile: Dockerfile.dev    
    volumes:
      - /app/node_modules     
      - .:/app                
    command: ["npm", "run", "test"]